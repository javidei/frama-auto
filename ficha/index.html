:root{color-scheme:dark;--gold:#d6b36c;--text:#f3f0e9}

body{margin:0;background:#0b0d10;color:var(--text);font:14px/1.65 Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}

@media(max-width:600px){.header-inner{height:70px}.nav{gap:12px;font-size:10px}.brand{font-size:19px}.footer-bottom{display:block}.footer-bottom a{display:block;margin-top:10px}}
